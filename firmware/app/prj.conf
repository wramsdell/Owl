# Owl firmware - Zephyr configuration defaults (scaffolding)
# Minimal config for building on RP2350 (Pico 2).
# Features enabled incrementally as development proceeds.

# Core settings
CONFIG_NEWLIB_LIBC=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_SERIAL=y

# SMP dual-core support (RP2350 has two Cortex-M33 cores)
CONFIG_SMP=y
CONFIG_NRFX_CLOCK=n
CONFIG_RP_PICO_MPU=y

# Device tree support
CONFIG_DTS=y

# Logging (enabled for scaffolding/verification)
CONFIG_LOG=y
CONFIG_LOG_MODE_OVERFLOW=y

# Minimal networking (placeholder - Ethernet driver TBD)
CONFIG_NET=y
CONFIG_NET_TCP=y

# No features enabled beyond basics. This is scaffolding only.
